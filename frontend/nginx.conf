server {
    listen 80;
    root /usr/share/nginx/html;

    location /api/ {
        # Evidências da tarefa: até 5 MB por imagem.
        client_max_body_size 6m;
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
    }

    location / {
        try_files $uri /index.html;
    }
}
