spring.docker.compose.enabled=false
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://${POSTGRES_HOST:postgres}:${POSTGRES_PORT:5432}/${POSTGRES_DB:smartmall}}
spring.datasource.username=${POSTGRES_USER:${DATABASE_USER:smartmall}}
spring.datasource.password=${POSTGRES_PASSWORD:${DATABASE_PASSWORD:smartmall}}
spring.liquibase.contexts=dev